<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Siboga Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
    /* Layout: full-screen CRT terminal, HUD on top, ASCII sea in the middle, log at the bottom */
    :root {
        --bg: #050a07;
        --fg: #7dffa8;
        --dim: #2f7a4c;
        --hot: #d8ffe4;
        --amber: #ffcc66;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
    }
    html, body { height: 100%; }
    body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
        overflow: hidden;
        text-shadow: 0 0 6px rgba(125, 255, 168, 0.55);
    }
    .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-block: 14px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        box-sizing: border-box;
    }
    .hud {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 24px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px dashed var(--dim);
        padding-bottom: 8px;
    }
    .hud b { color: var(--fg); font-weight: 600; }
    .hud .rec { color: var(--amber); text-shadow: 0 0 6px rgba(255, 204, 102, 0.6); }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #sea {
        flex: 1;
        min-height: 0;
        margin: 0;
        font-size: 13px;
        line-height: 1.05;
        white-space: pre;
        overflow: hidden;
        color: var(--fg);
    }
    #sea .s { color: var(--hot); }
    .log {
        font-size: 12px;
        line-height: 1.5;
        height: 7.5em;
        overflow: hidden;
        color: var(--dim);
        border-top: 1px dashed var(--dim);
        padding-top: 8px;
        font-variant-numeric: tabular-nums;
    }
    .log div:last-child { color: var(--fg); }
    .cursor { display: inline-block; width: 0.6em; background: var(--fg); animation: blink 0.8s steps(1) infinite; }
    /* CRT scanlines + vignette */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.28) 3px),
            radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.7) 100%);
        z-index: 5;
    }
    @media (max-width: 600px) {
        #sea { font-size: 9px; }
        .hud, .log { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
        .blink, .cursor { animation: none; }
    }
</style>

<div class="screen">
    <header class="hud">
        <span><b>HNLMS SIBOGA</b> // expeditie 1899-1900</span>
        <span>pos <b id="pos">--</b></span>
        <span>hdg <b id="hdg">---</b> // <b id="kn">0.0</b> kn</span>
        <span class="rec"><span class="blink">&#9679;</span> LIVE</span>
    </header>
    <pre id="sea" aria-label="Animated ASCII drawing of the steamship Siboga on a rolling sea"></pre>
    <div class="log" id="log" aria-live="off"></div>
</div>

<script>
    const sea = document.getElementById("sea");
    const logEl = document.getElementById("log");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const SHIP = [
        "            |          (       |",
        "           -+-        ##      -+-",
        "          /|||\\       ##     /|||\\",
        "         //|||\\\\      ##    //|||\\\\",
        "        ///|||\\\\\\   _##_  ///|||\\\\\\",
        "    _______|________|____|____|________",
        "    \\  o   o   o   o   o   o   o   o  /",
        "     \\   S I B O G A                 /",
        "      \\_____________________________/"
    ];
    const SHIP_W = Math.max(...SHIP.map((l) => l.length));
    const FUNNEL_COL = SHIP[1].indexOf("#") + 1;

    let cols = 80;
    let rows = 30;
    let smoke = [];
    let stars = [];
    let t = 0;

    function measure() {
        const probe = document.createElement("span");
        probe.textContent = "M".repeat(10);
        sea.appendChild(probe);
        const r = probe.getBoundingClientRect();
        sea.removeChild(probe);
        const cw = r.width / 10;
        const ch = r.height;
        const box = sea.getBoundingClientRect();
        cols = Math.max(40, Math.floor(box.width / cw));
        rows = Math.max(18, Math.floor(box.height / ch));
        stars = [];
        for (let i = 0; i < cols * rows * 0.012; i++) {
            stars.push({ x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows * 0.4), p: Math.random() * 6 });
        }
    }

    function frame() {
        const grid = Array.from({ length: rows }, () => new Array(cols).fill(" "));
        const seaTop = Math.floor(rows * 0.68);

        // stars, flickering
        for (const s of stars) {
            const v = Math.sin(t * 2 + s.p);
            grid[s.y][s.x] = v > 0.6 ? "*" : v > -0.2 ? "." : " ";
        }

        // moon
        const mx = Math.floor(cols * 0.8);
        ["  _  ", " ( ) ", "  -  "].forEach((l, i) => {
            for (let j = 0; j < l.length; j++) {
                if (l[j] !== " " && grid[2 + i] && mx + j < cols) {
                    grid[2 + i][mx + j] = l[j];
                }
            }
        });

        // waves
        const chars = " .-~~=";
        for (let y = seaTop; y < rows; y++) {
            const depth = (y - seaTop) / (rows - seaTop);
            for (let x = 0; x < cols; x++) {
                const v = Math.sin(x * 0.18 + t * 1.6 + y * 0.9) + Math.sin(x * 0.05 - t * 0.6 + y * 0.3) * 0.8;
                const n = (v + 1.8) / 3.6 + depth * 0.25;
                grid[y][x] = chars[Math.max(0, Math.min(chars.length - 1, Math.floor(n * chars.length)))];
            }
        }

        // ship: drifts left to right, bobs on the swell
        const span = cols + SHIP_W;
        const sx = Math.floor(((t * 3) % span) - SHIP_W);
        const bob = Math.round(Math.sin(t * 1.3));
        const sy = seaTop - SHIP.length + 2 + bob;
        SHIP.forEach((line, i) => {
            const y = sy + i;
            if (y < 0 || y >= rows) {
                return;
            }
            const first = line.search(/\S/);
            const last = line.length - 1 - line.split("").reverse().join("").search(/\S/);
            for (let j = first; j <= last; j++) {
                const x = sx + j;
                if (x >= 0 && x < cols) {
                    grid[y][x] = line[j] === " " && i < 5 ? grid[y][x] : line[j];
                }
            }
        });

        // smoke from the funnel
        if (!reduce || smoke.length === 0) {
            smoke.push({ x: sx + FUNNEL_COL, y: sy, age: 0 });
        }
        smoke = smoke.filter((p) => p.age < 14);
        for (const p of smoke) {
            p.age += 1;
            p.y -= 0.6;
            p.x -= 0.7 + Math.random() * 0.4;
            const gx = Math.round(p.x);
            const gy = Math.round(p.y);
            if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
                grid[gy][gx] = p.age < 4 ? "@" : p.age < 8 ? "o" : p.age < 11 ? "°" : ".";
            }
        }

        sea.textContent = grid.map((r) => r.join("")).join("\n");
    }

    // HUD: fake but plausible position in the Indonesian archipelago
    let lat = -5.12;
    let lon = 119.41;
    function hud() {
        lat += (Math.random() - 0.5) * 0.01;
        lon += 0.004 + Math.random() * 0.004;
        const ns = lat < 0 ? "S" : "N";
        document.getElementById("pos").textContent = Math.abs(lat).toFixed(3) + "° " + ns + "  " + lon.toFixed(3) + "° E";
        document.getElementById("hdg").textContent = String(88 + Math.floor(Math.random() * 6)).padStart(3, "0");
        document.getElementById("kn").textContent = (7 + Math.random() * 1.5).toFixed(1);
    }

    // log: typed out line by line
    const MESSAGES = [
        "boot SIBOGA.SYS ... ok",
        "steam pressure nominal // coal bunkers 64%",
        "dredge lowered // wire out {d} m",
        "station {s} // depth {d} m // sample sealed in spirits",
        "plankton net hauled // jar #{n} labelled",
        "sounding {d} m // bottom: grey mud, foraminifera",
        "trawl up // sponges, crinoids, 1 unknown hydroid",
        "algae pressed // herbarium sheet #{n}",
        "bottle temp at {d} m: {c} °C",
        "course correction // next station in 4.2 nm"
    ];
    let station = 1;
    function fill(msg) {
        return msg
            .replace("{d}", String(Math.floor(40 + Math.random() * 4500)))
            .replace("{s}", String(station++).padStart(3, "0"))
            .replace("{n}", String(Math.floor(100 + Math.random() * 900)))
            .replace("{c}", (3 + Math.random() * 24).toFixed(1));
    }
    function stamp() {
        const d = new Date();
        return "1899-" + String(3 + (station % 9)).padStart(2, "0") + "-" + String(1 + (station % 28)).padStart(2, "0") + " " + d.toTimeString().slice(0, 8);
    }
    function typeLine(text) {
        const div = document.createElement("div");
        logEl.appendChild(div);
        while (logEl.children.length > 5) {
            logEl.removeChild(logEl.firstChild);
        }
        const full = "[" + stamp() + "] > " + text;
        if (reduce) {
            div.textContent = full;
            return;
        }
        let i = 0;
        const cur = document.createElement("span");
        cur.className = "cursor";
        cur.innerHTML = "&nbsp;";
        const iv = setInterval(() => {
            i += 2;
            div.textContent = full.slice(0, i);
            div.appendChild(cur);
            if (i >= full.length) {
                clearInterval(iv);
                setTimeout(() => cur.remove(), 900);
            }
        }, 22);
    }

    measure();
    window.addEventListener("resize", measure);
    hud();
    typeLine(MESSAGES[0]);
    typeLine(fill(MESSAGES[2]));

    if (reduce) {
        t = 4;
        frame();
    } else {
        setInterval(() => {
            t += 0.08;
            frame();
        }, 70);
        setInterval(hud, 1500);
        setInterval(() => {
            typeLine(fill(MESSAGES[1 + Math.floor(Math.random() * (MESSAGES.length - 1))]));
        }, 2600);
    }
    frame();
</script>

</body></html>
