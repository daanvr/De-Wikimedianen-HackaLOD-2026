# Default settings. Override whatever you want in config.toml (not in git).
# Paths are relative to the root of the code repo.

[content]
path = "content"

[cache]
path = "pipeline/cache/siboga.sqlite"
media_path = "pipeline/cache/media"
max_age_days = 30

[output]
path = "frontend/public/data"

[http]
user_agent = "SibogaExpeditie/0.1 (https://siboga.nl; team De Wikimedianen, HackaLOD 2026)"
timeout_seconds = 30

[media]
image_width = 1600

[explorer]
# The gold dataset; its specimens with a station get their GBIF record and image
gold_path = "frontend/public/datasets/siboga-goud.json"
# The stations along the route; those with an image on Wikidata get it in the dive
stations_path = "frontend/public/datasets/route-stations.json"
