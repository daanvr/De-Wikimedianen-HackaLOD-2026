# Which fields a record shows depends on its contenttype (not on its source).
#
# [contenttypes]: per contenttype the fields, in the order in which they are shown.
# [fields]: per field the kind of value.
#   date = always YYYY, YYYY-MM or YYYY-MM-DD
#   text = plain text
#
# Which source can fill which field is defined in the adapters (pipeline/src/siboga/sources/).
# The label of a field on the site comes from i18n, as the message field_<field>, e.g. field_birth_date.

[contenttypes]
person = ["birth_date", "birth_place", "death_date", "death_place", "occupation", "employer", "alternate_name", "work"]
specimen = ["scientific_name", "vernacular_name", "taxon_rank", "family", "order", "parent_taxon"]
media = ["creator", "created", "date_description", "collection", "archive"]
item = ["author", "publication_date", "inception", "publisher", "published_in", "collection"]
publication = ["author", "publication_date", "published_in"]
expedition = ["start_date", "end_date", "location", "participant"]
location = ["country", "location"]

[fields]
alternate_name = "text"
archive = "text"
author = "text"
birth_date = "date"
birth_place = "text"
collection = "text"
country = "text"
created = "date"
creator = "text"
date_description = "text"
death_date = "date"
death_place = "text"
employer = "text"
end_date = "date"
family = "text"
inception = "date"
location = "text"
occupation = "text"
order = "text"
parent_taxon = "text"
participant = "text"
point_in_time = "date"
publication_date = "date"
published_in = "text"
publisher = "text"
scientific_name = "text"
start_date = "date"
taxon_rank = "text"
vernacular_name = "text"
work = "text"
