[project]
name = "siboga"
version = "0.1.0"
description = "Pipeline die de frontend data van De Siboga Expeditie bouwt"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "pillow>=11",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
siboga = "siboga.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siboga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
