server {
    server_name siboga.nl www.siboga.nl;

    error_log  /var/www/siboga.nl/logs/error.log;
    access_log /var/www/siboga.nl/logs/access.log;

    root /var/www/siboga.nl/htdocs;
    index index.html index.htm;
    server_name siboga.nl www.siboga.nl;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/siboga.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/siboga.nl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.siboga.nl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = siboga.nl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name siboga.nl www.siboga.nl;
    server_name siboga.nl www.siboga.nl;
    return 404; # managed by Certbot
}